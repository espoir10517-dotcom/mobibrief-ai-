# 뉴스 수집(매일) → 주간 브리핑 발행(매주 월요일)
# - 매일 오전 6시 30분(한국시간): 뉴스 수집만 (무료, AI 사용 안 함)
# - 월요일 오전 6시 30분: 지난 7일치 뉴스로 분야별 TOP 10 선정·요약 → 앱에 반영
# - Actions 탭 → '뉴스 수집 및 주간 브리핑' → Run workflow 로 직접 실행 가능 (발행 여부 선택)
# - ANTHROPIC_API_KEY 또는 OPENAI_API_KEY 비밀값이 있으면 AI 편집, 없으면 규칙 기반

name: 뉴스 수집 및 주간 브리핑

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '지금 브리핑을 만들어 앱에 반영할까요? (false = 수집만)'
        type: boolean
        default: true
      backfill_days:
        description: '지난 며칠치 기사를 채워 넣을까요? (처음 시작할 때만, 0 = 안 함, 최대 14)'
        type: string
        default: '0'
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 한국시간 06:30 매일

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 점검
        run: npm test

      - name: 뉴스 수집
        run: npm run collect
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 지난 기사 채우기 (직접 실행 시 선택)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_days != '0' && inputs.backfill_days != ''
        run: node pipeline/backfill.mjs --days "${{ inputs.backfill_days }}"

      - name: 발행일인지 확인 (한국시간 월요일 또는 직접 실행)
        id: when
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "1" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "한국시간 요일: $DOW (1=월요일)"

      - name: 주간 브리핑 만들기 (AI 키가 있으면 AI 편집, 없으면 규칙 기반)
        if: steps.when.outputs.publish == 'true'
        run: npm run build:briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 발행 데이터 점검 (빈 값·깨진 링크·중복)
        if: steps.when.outputs.publish == 'true'
        run: npm run validate

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "mobibrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected public/data/live
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      - name: 앱에 반영 (GitHub Pages)
        if: steps.when.outputs.publish == 'true'
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add ../site origin/gh-pages
          rsync -a --delete --exclude .git public/ ../site/
          touch ../site/.nojekyll
          cd ../site
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "앱 업데이트 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push origin HEAD:gh-pages
