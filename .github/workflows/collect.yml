# 매일 뉴스 수집 → 오늘의 브리핑 생성 → 앱 반영
# - 매일 오전 6시 30분(한국시간)에 자동 실행, Actions 탭에서 'Run workflow'로 직접 실행도 가능
# - 결과는 data/collected/ 폴더에 날짜별로 저장됩니다
# - ANTHROPIC_API_KEY 또는 OPENAI_API_KEY 비밀값이 있으면 AI가 평가·선정·요약, 없으면 규칙 기반 (AI 비용 0원)

name: 뉴스 수집 및 앱 업데이트

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 한국시간 06:30

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 점검
        run: npm test

      - name: 뉴스 수집
        run: npm run collect
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 오늘의 브리핑 만들기 (AI 키가 있으면 AI 편집, 없으면 규칙 기반)
        run: npm run build:briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "mobibrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected public/data/live
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      - name: 앱에 반영 (GitHub Pages)
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add ../site origin/gh-pages
          rsync -a --delete --exclude .git public/ ../site/
          touch ../site/.nojekyll
          cd ../site
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "앱 업데이트 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push origin HEAD:gh-pages
