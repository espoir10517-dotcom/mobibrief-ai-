# 매일 뉴스 수집 (Phase 2)
# - 매일 오전 6시 30분(한국시간)에 자동 실행, Actions 탭에서 'Run workflow'로 직접 실행도 가능
# - 결과는 data/collected/ 폴더에 날짜별로 저장됩니다
# - Phase 3~4에서 AI 분석과 앱 데이터 갱신 단계가 이 작업에 추가됩니다

name: 뉴스 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 한국시간 06:30

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 점검
        run: npm test

      - name: 뉴스 수집
        run: npm run collect
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: 결과 저장
        run: |
          git config user.name "mobibrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "뉴스 수집 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
