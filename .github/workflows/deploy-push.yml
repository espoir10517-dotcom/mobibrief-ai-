# 알림 서버(Cloudflare Worker) 배포
# - Cloudflare 비밀값(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)을 등록한 뒤 Actions 탭에서 'Run workflow'
# - 알림 서버 코드가 바뀌면 자동으로 다시 배포
# - 처음 배포하면 앱 설정에 서버 주소가 기록되고, 앱 SETTINGS 에 알림 켜기 화면이 나타남

name: 알림 서버 배포

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'pipeline/push/**'
      - 'scripts/deploy-push.mjs'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 점검
        run: node scripts/test-push.mjs

      - name: 알림 서버 배포
        run: node scripts/deploy-push.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 앱 설정 저장 및 앱 반영
        run: |
          git config user.name "mobibrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/config.js
          if git diff --cached --quiet; then echo "앱 설정 변경 없음"; exit 0; fi
          git commit -m "알림 서버 주소 연결"
          git pull --rebase
          git push
          git fetch origin gh-pages --depth=1
          git worktree add ../site origin/gh-pages
          rsync -a --delete --exclude .git public/ ../site/
          touch ../site/.nojekyll
          cd ../site
          git add -A
          git commit -m "앱 업데이트: 알림 켜기" || exit 0
          git push origin HEAD:gh-pages
